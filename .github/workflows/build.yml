name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls
          for f in DhyanMod*.zip; do unzip -q -o "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: DhyanMod
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DhyanMod-debug-apk
          path: DhyanMod/app/build/outputs/apk/debug/app-debug.apk
